<!doctype html>
<html class="h-full" lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat · SAGE</title>

  <!-- theme bootstrap: runs before first paint -->
  <script src="{{ url_for('static', filename='theme.js') }}"></script>

  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Public+Sans:wght@500;600&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8'
            }
          },
          fontFamily: {
            headline: ["Plus Jakarta Sans", "sans-serif"],
            display: ["Plus Jakarta Sans", "sans-serif"],
            body: ["Inter", "sans-serif"],
            label: ["Public Sans", "sans-serif"]
          }
        },
      },
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="h-full bg-slate-50 text-slate-800 antialiased font-body selection:bg-blue-100 selection:text-blue-900 dark:bg-slate-950 dark:text-slate-200 dark:selection:bg-blue-900 dark:selection:text-blue-100">

  <div class="h-screen w-full flex flex-col justify-between max-w-[880px] mx-auto bg-white dark:bg-slate-900 shadow-[0_0_50px_-12px_rgba(0,0,0,0.06)] dark:shadow-none border-x border-slate-200/80 dark:border-slate-800">

    <!-- Top app bar -->
    <header class="sticky top-0 z-40 w-full bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-zinc-200/80 dark:border-slate-800 shadow-sm">
      <div class="px-4 h-14 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 rounded-lg bg-[#2563eb] text-white flex items-center justify-center shadow-sm shadow-blue-500/20">
            <span class="material-symbols-outlined text-[19px]" aria-hidden="true">anchor</span>
          </div>
          <h1 class="font-display text-base font-bold text-zinc-900 dark:text-white tracking-tight">SAGE</h1>
        </div>

        <div class="flex items-center gap-2 text-sm">
          <div class="flex items-center text-slate-600 dark:text-slate-300 font-medium">
            <span id="greeting">Hi there</span>
            <button class="text-xs text-blue-600 dark:text-blue-400 hover:text-blue-700 dark:hover:text-blue-300 underline cursor-pointer ml-2 font-normal transition-colors" id="logout" type="button">log out</button>
          </div>

          <div class="h-4 w-[1px] bg-slate-200 dark:bg-slate-700 mx-1 hidden sm:block"></div>

          <button
            type="button"
            data-lang-toggle
            id="lang-toggle"
            aria-label="Switch language"
            title="Language"
            class="h-8 px-2.5 rounded-full flex items-center gap-1 border transition-colors bg-slate-100 border-slate-200 text-slate-600 hover:bg-slate-200 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/40 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white"
          >
            <span class="material-symbols-outlined text-[17px]" aria-hidden="true">language</span>
            <span id="lang-label" class="text-xs font-semibold">EN</span>
          </button>

          <button
            type="button"
            data-theme-toggle
            aria-label="Switch theme"
            title="Theme"
            class="w-8 h-8 rounded-full flex items-center justify-center border transition-colors bg-slate-100 border-slate-200 text-slate-600 hover:bg-slate-200 hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-blue-500/40 dark:bg-slate-800 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-700 dark:hover:text-white"
          >
            <svg data-theme-icon="to-dark" xmlns="http://www.w3.org/2000/svg" class="hidden w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg data-theme-icon="to-light" xmlns="http://www.w3.org/2000/svg" class="hidden w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </button>

          <button class="w-8 h-8 rounded-full bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 flex items-center justify-center text-slate-700 dark:text-slate-200 transition-colors" title="You" type="button">
            <span id="avatar" class="text-xs font-semibold">?</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Message thread -->
    <main class="flex-1 overflow-y-auto px-4 py-6 space-y-6 scroll-smooth" id="messages" aria-live="polite">

      <!-- Greeting -->
      <div class="flex items-start gap-3 max-w-[85%] group animate-fade-in" id="welcome-row">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex-shrink-0 flex items-center justify-center shadow-sm mt-0.5">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">smart_toy</span>
        </div>
        <div class="flex flex-col">
          <div class="bg-[#eef1f5] text-[#1e293b] dark:bg-slate-800 dark:text-slate-100 px-4 py-3 rounded-[16px] rounded-bl-[4px] text-[15px] leading-relaxed shadow-sm whitespace-pre-wrap break-words" id="welcome-bubble"></div>
          <span class="text-xs text-slate-400 dark:text-slate-500 mt-1.5 ml-1 font-label">Token Harbor AI</span>
        </div>
      </div>

    </main>

    <!-- Composer -->
    <footer class="sticky bottom-0 z-30 bg-gradient-to-t from-white via-white/95 to-white/70 dark:from-slate-900 dark:via-slate-900/95 dark:to-slate-900/70 backdrop-blur-md pt-2 pb-3 px-4 border-t border-slate-200/80 dark:border-slate-800">
      <form class="w-full" id="composer">
        <div class="rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/90 dark:border-slate-700 shadow-sm focus-within:ring-2 focus-within:ring-blue-500/20 focus-within:border-blue-500 p-2.5 flex items-end gap-2.5 transition-all">
          <button class="text-xs font-medium text-slate-400 dark:text-slate-500 hover:text-slate-600 dark:hover:text-slate-300 px-2.5 py-2 rounded-lg transition-colors flex items-center gap-1 flex-shrink-0" id="clear" title="Clear conversation" type="button">
            <span class="material-symbols-outlined text-base" aria-hidden="true">ink_eraser</span>
            <span class="hidden sm:inline" id="clear-label">Clear</span>
          </button>

          <textarea class="resize-none text-[15px] leading-relaxed text-slate-800 dark:text-slate-100 placeholder:text-slate-400 dark:placeholder:text-slate-500 bg-transparent flex-1 border-0 focus:outline-none py-1.5 max-h-36 overflow-y-auto" id="input" placeholder="Type a message…  (Enter to send, Shift+Enter for a new line)" rows="1" autofocus></textarea>

          <button aria-label="Send message" class="w-9 h-9 rounded-full bg-[#2563eb] text-white flex items-center justify-center hover:bg-blue-700 transition-all shadow-sm hover:shadow active:scale-95 flex-shrink-0 disabled:opacity-50 disabled:cursor-not-allowed" id="send" type="submit">
            <svg class="w-4 h-4 translate-x-0.5 -translate-y-0.5 fill-current" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
          </button>
        </div>
      </form>

      <div class="mt-2 text-center">
        <p class="text-[11px] font-label text-slate-400 dark:text-slate-500 tracking-tight flex items-center justify-center gap-2 min-h-[16px]">
          <span id="status-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" style="display:none"></span>
          <span id="status"></span>
        </p>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='session.js') }}"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
