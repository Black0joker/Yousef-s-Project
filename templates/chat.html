<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat · SAGE</title>

  <!-- theme bootstrap: runs before first paint -->
  <script src="{{ url_for('static', filename='theme.js') }}"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            label: ['Inter', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef5f1', 100: '#dbe5e0', 200: '#b9ede0', 300: '#9ed1c4',
              400: '#7ca89b', 500: '#5b8f7a', 600: '#3b665b', 700: '#1c4f45',
              800: '#143f36', 900: '#0f3d33', 950: '#00261e',
            },
            sand: {
              50: '#faf9f5', 100: '#f5f4f0', 200: '#e3e2df', 300: '#d8d6d1',
              400: '#b6b4ae', 500: '#8a8883',
            },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="h-full bg-sand-50 font-body text-brand-950 antialiased selection:bg-brand-200 selection:text-brand-950 dark:bg-[#0b1512] dark:text-sand-100 dark:selection:bg-brand-700 dark:selection:text-white">

  <div class="app-shell mx-auto flex w-full max-w-[880px] flex-col bg-white shadow-[0_0_60px_-24px_rgba(15,61,51,0.25)] dark:bg-[#141d1b] border-x border-sand-200/80 dark:border-white/5">

    <!-- Top app bar -->
    <header class="app-header sticky top-0 z-40 w-full border-b border-sand-200/80 bg-white/85 backdrop-blur-md dark:border-white/5 dark:bg-[#141d1b]/85">
      <div class="flex h-14 items-center justify-between gap-2 px-4">

        <div class="flex min-w-0 items-center gap-2.5">
          <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-xl bg-brand-900 text-brand-200 shadow-sm shadow-brand-900/20">
            <span class="material-symbols-outlined text-[19px]" aria-hidden="true">spa</span>
          </span>
          <h1 class="font-display text-[15px] font-extrabold tracking-[0.14em] text-brand-950 dark:text-white">SAGE</h1>

          <span class="ms-1 hidden items-center gap-1 rounded-full bg-brand-50 px-2 py-1 text-[10px] font-semibold tracking-wide text-brand-700 ring-1 ring-brand-100 dark:bg-brand-900/40 dark:text-brand-200 dark:ring-brand-800 sm:inline-flex">
            <span class="material-symbols-outlined text-[13px]" aria-hidden="true">auto_awesome</span>
            Personal memory
          </span>
        </div>

        <div class="flex shrink-0 items-center gap-1.5 text-sm">
          <span id="greeting" class="hidden max-w-[160px] truncate font-medium text-brand-700 dark:text-sand-300 sm:inline">Hi there</span>

          <button class="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-full text-xs font-normal text-brand-500 transition-colors hover:bg-sand-100 hover:text-brand-800 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:text-brand-300 dark:hover:bg-white/5 dark:hover:text-white sm:h-8 sm:w-auto sm:justify-start sm:bg-transparent sm:px-0 sm:underline sm:underline-offset-2 sm:hover:bg-transparent" id="logout" type="button" aria-label="Log out">
            <span class="material-symbols-outlined text-[17px] sm:hidden" aria-hidden="true">logout</span>
            <span class="hidden sm:inline" id="logout-label">log out</span>
          </button>

          <div class="mx-1 hidden h-4 w-px bg-sand-200 dark:bg-white/10 sm:block"></div>

          <div class="hidden items-center gap-1.5 lg:flex">
            <a href="/trusted" id="trusted-link" title="Trusted people" aria-label="Trusted people"
               class="flex h-8 items-center gap-1 rounded-full border border-sand-200 bg-sand-100 px-2.5 text-xs font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white">
              <span class="material-symbols-outlined text-[17px]" aria-hidden="true">diversity_3</span>
              <span>Trusted</span>
            </a>

            <a href="/schedule" id="schedule-link" title="Schedule" aria-label="Appointments and routines"
               class="flex h-8 items-center gap-1 rounded-full border border-sand-200 bg-sand-100 px-2.5 text-xs font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white">
              <span class="material-symbols-outlined text-[17px]" aria-hidden="true">event</span>
              <span>Schedule</span>
            </a>

            <a href="/memory" id="memory-link" title="Memory" aria-label="What SAGE remembers"
               class="flex h-8 items-center gap-1 rounded-full border border-sand-200 bg-sand-100 px-2.5 text-xs font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white">
              <span class="material-symbols-outlined text-[17px]" aria-hidden="true">psychology</span>
              <span>Memory</span>
            </a>

            <a href="/call" id="call-link" title="Voice call" aria-label="Start a voice call"
               class="flex h-8 items-center gap-1 rounded-full border border-sand-200 bg-sand-100 px-2.5 text-xs font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white">
              <span class="material-symbols-outlined text-[17px]" aria-hidden="true">call</span>
              <span>Call</span>
            </a>
          </div>

          <button
            type="button"
            data-lang-toggle
            id="lang-toggle"
            aria-label="Switch language"
            title="Language"
            class="flex h-8 items-center gap-1 rounded-full border border-sand-200 bg-sand-100 px-2.5 text-brand-600 transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-300 dark:hover:bg-white/10 dark:hover:text-white"
          >
            <span class="material-symbols-outlined text-[17px]" aria-hidden="true">language</span>
            <span id="lang-label" class="text-xs font-semibold">EN</span>
          </button>

          <button
            type="button"
            data-theme-toggle
            aria-label="Switch theme"
            title="Theme"
            class="flex h-8 w-8 items-center justify-center rounded-full border border-sand-200 bg-sand-100 text-brand-600 transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-300 dark:hover:bg-white/10 dark:hover:text-white"
          >
            <svg data-theme-icon="to-dark" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg data-theme-icon="to-light" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </button>

          <a href="/settings" title="Account settings" aria-label="Account settings" class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-100 text-brand-800 transition-colors hover:bg-brand-200 dark:bg-brand-900/60 dark:text-brand-200 dark:hover:bg-brand-800">
            <span id="avatar" class="text-[11px] font-bold">?</span>
          </a>
        </div>
      </div>

      <!-- Section tabs: the app bar is too narrow for the pills below lg -->
      <nav aria-label="Sections" class="grid grid-cols-4 gap-1.5 px-3 pb-2 sm:flex sm:items-center sm:gap-2 sm:px-4 lg:hidden">
        <a href="/trusted" class="flex h-12 flex-col items-center justify-center gap-0.5 rounded-xl bg-sand-100 text-[10px] font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white sm:h-9 sm:flex-row sm:gap-1.5 sm:rounded-full sm:border sm:border-sand-200 sm:px-3 sm:text-xs sm:dark:border-white/10">
          <span class="material-symbols-outlined text-[19px] sm:text-[17px]" aria-hidden="true">diversity_3</span>
          <span>Trusted</span>
        </a>
        <a href="/schedule" class="flex h-12 flex-col items-center justify-center gap-0.5 rounded-xl bg-sand-100 text-[10px] font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white sm:h-9 sm:flex-row sm:gap-1.5 sm:rounded-full sm:border sm:border-sand-200 sm:px-3 sm:text-xs sm:dark:border-white/10">
          <span class="material-symbols-outlined text-[19px] sm:text-[17px]" aria-hidden="true">event</span>
          <span>Schedule</span>
        </a>
        <a href="/memory" class="flex h-12 flex-col items-center justify-center gap-0.5 rounded-xl bg-sand-100 text-[10px] font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white sm:h-9 sm:flex-row sm:gap-1.5 sm:rounded-full sm:border sm:border-sand-200 sm:px-3 sm:text-xs sm:dark:border-white/10">
          <span class="material-symbols-outlined text-[19px] sm:text-[17px]" aria-hidden="true">psychology</span>
          <span>Memory</span>
        </a>
        <a href="/call" class="flex h-12 flex-col items-center justify-center gap-0.5 rounded-xl bg-sand-100 text-[10px] font-semibold text-brand-700 no-underline transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 dark:hover:text-white sm:h-9 sm:flex-row sm:gap-1.5 sm:rounded-full sm:border sm:border-sand-200 sm:px-3 sm:text-xs sm:dark:border-white/10">
          <span class="material-symbols-outlined text-[19px] sm:text-[17px]" aria-hidden="true">call</span>
          <span>Call</span>
        </a>
      </nav>
    </header>

    <!-- Today's appointment reminder; filled by schedule-reminder.js -->
    <div id="schedule-reminder" class="hidden border-b border-brand-200 bg-brand-50 px-4 py-2 text-sm text-brand-800 dark:border-brand-800 dark:bg-brand-900/40 dark:text-brand-100" role="status">
      <span class="material-symbols-outlined align-middle text-[16px]" aria-hidden="true">event</span>
      <span id="schedule-reminder-text"></span>
    </div>

    <!-- Familiar place; filled by location.js -->
    <div id="place-context" class="hidden border-b border-sand-200 bg-sand-100 px-4 py-2 text-sm text-brand-700 dark:border-white/10 dark:bg-white/5 dark:text-sand-200" role="status">
      <span class="material-symbols-outlined align-middle text-[16px]" aria-hidden="true">place</span>
      <span id="place-context-text"></span>
    </div>

    <!-- Message thread -->
    <main class="page-enter min-h-0 flex-1 space-y-6 overflow-y-auto px-4 py-6" id="messages" aria-live="polite">

      <!-- Greeting -->
      <div class="chat-row animate-fade-in" id="welcome-row">
        <div class="chat-avatar">
          <span class="material-symbols-outlined text-[16px]" aria-hidden="true">spa</span>
        </div>
        <div class="chat-col">
          <div class="bubble bubble--assistant" id="welcome-bubble" dir="auto"></div>
          <div class="chat-meta">
            <span class="chat-time">SAGE</span>
          </div>
        </div>
      </div>

      <!-- Starter prompts; labels come from STRINGS so they follow the language -->
      <div class="flex flex-wrap gap-2 ps-11" id="chat-suggestions">
        <button type="button" class="chat-suggestion tap-style" data-suggest="1"></button>
        <button type="button" class="chat-suggestion tap-style" data-suggest="2"></button>
        <button type="button" class="chat-suggestion tap-style" data-suggest="3"></button>
      </div>

    </main>

    <!-- Appears when you scroll up while a reply is still arriving -->
    <button type="button" class="chat-jump" id="jump-latest" aria-hidden="true" tabindex="-1">
      <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
      <span id="jump-latest-label">Latest</span>
    </button>

    <!-- Composer -->
    <footer class="composer-footer sticky bottom-0 z-30 border-t border-sand-200/80 bg-gradient-to-t from-white via-white/95 to-white/80 px-4 pt-3 backdrop-blur-md dark:border-white/5 dark:from-[#141d1b] dark:via-[#141d1b]/95 dark:to-[#141d1b]/80">
      <form class="w-full" id="composer">
        <div class="flex items-end gap-2.5 rounded-2xl border border-sand-200 bg-sand-50/60 p-2.5 shadow-sm transition-all focus-within:border-brand-500 focus-within:ring-2 focus-within:ring-brand-600/15 dark:border-white/10 dark:bg-white/5">
          <button class="flex flex-shrink-0 items-center gap-1 rounded-lg px-2.5 py-2 text-xs font-medium text-brand-400 transition-colors hover:bg-white hover:text-brand-700 dark:text-sand-500 dark:hover:bg-white/5 dark:hover:text-sand-200" id="clear" title="Clear conversation" type="button">
            <span class="material-symbols-outlined text-base" aria-hidden="true">ink_eraser</span>
            <span class="hidden sm:inline" id="clear-label">Clear</span>
          </button>

          <textarea class="max-h-36 flex-1 resize-none overflow-y-auto border-0 bg-transparent py-1.5 text-[15px] leading-relaxed text-brand-950 placeholder:text-brand-400 focus:outline-none dark:text-sand-100 dark:placeholder:text-sand-500" id="input" placeholder="Type a message…  (Enter to send, Shift+Enter for a new line)" rows="1" autofocus></textarea>

          <button aria-label="Stop generating" title="Stop generating" class="hidden h-9 w-9 flex-shrink-0 items-center justify-center rounded-full border border-sand-300 bg-white text-brand-700 transition-colors hover:bg-sand-100 active:scale-95 dark:border-white/15 dark:bg-white/5 dark:text-sand-200 dark:hover:bg-white/10 flex" id="stop" type="button">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">stop_circle</span>
          </button>

          <button aria-label="Send message" class="flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-brand-900 text-white shadow-sm transition-all hover:bg-brand-800 hover:shadow active:scale-95 disabled:cursor-not-allowed disabled:opacity-40 dark:bg-brand-200 dark:text-brand-950 dark:hover:bg-brand-100" id="send" type="submit">
            <span class="material-symbols-outlined text-[18px]" aria-hidden="true">arrow_upward</span>
          </button>
        </div>
      </form>

      <div class="mt-2 text-center">
        <p class="flex min-h-[16px] items-center justify-center gap-2 text-[11px] tracking-tight text-brand-400 dark:text-sand-500">
          <span id="status-dot" class="h-1.5 w-1.5 animate-pulse rounded-full bg-brand-500" style="display:none"></span>
          <span id="status"></span>
        </p>
      </div>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='session.js') }}"></script>
  <script src="{{ url_for('static', filename='location.js') }}"></script>
  <script src="{{ url_for('static', filename='schedule-reminder.js') }}"></script>
  <script src="{{ url_for('static', filename='ui.js') }}"></script>
  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
