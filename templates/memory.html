<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory · SAGE</title>

  <!-- theme bootstrap: runs before first paint -->
  <script src="{{ url_for('static', filename='theme.js') }}"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..600,0..1,0&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            body: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eef5f1', 100: '#dbe5e0', 200: '#b9ede0', 300: '#9ed1c4',
              400: '#7ca89b', 500: '#5b8f7a', 600: '#3b665b', 700: '#1c4f45',
              800: '#143f36', 900: '#0f3d33', 950: '#00261e',
            },
            sand: {
              50: '#faf9f5', 100: '#f5f4f0', 200: '#e3e2df', 300: '#d8d6d1',
              400: '#b6b4ae', 500: '#8a8883',
            },
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-full bg-sand-50 font-body text-brand-950 antialiased selection:bg-brand-200 selection:text-brand-950 dark:bg-[#0b1512] dark:text-sand-100 dark:selection:bg-brand-700 dark:selection:text-white">

  <div class="mx-auto flex min-h-screen w-full max-w-[880px] flex-col border-x border-sand-200/80 bg-white shadow-[0_0_60px_-24px_rgba(15,61,51,0.25)] dark:border-white/5 dark:bg-[#141d1b]">

    <!-- Top bar -->
    <header class="sticky top-0 z-40 w-full border-b border-sand-200/80 bg-white/85 backdrop-blur-md dark:border-white/5 dark:bg-[#141d1b]/85">
      <div class="flex h-14 items-center justify-between px-4">
        <div class="flex items-center gap-2.5">
          <a href="/chat" title="Back to chat" aria-label="Back to chat"
             class="flex h-8 w-8 items-center justify-center rounded-full text-brand-500 transition-colors hover:bg-sand-100 hover:text-brand-900 dark:text-sand-400 dark:hover:bg-white/5 dark:hover:text-white">
            <span class="material-symbols-outlined text-[19px]" aria-hidden="true">arrow_back</span>
          </a>
          <span class="flex h-8 w-8 items-center justify-center rounded-xl bg-brand-900 text-brand-200">
            <span class="material-symbols-outlined text-[19px]" aria-hidden="true">spa</span>
          </span>
          <h1 class="font-display text-[15px] font-extrabold tracking-[0.14em] text-brand-950 dark:text-white">SAGE</h1>
        </div>

        <div class="flex items-center gap-1.5">
          <button
            type="button"
            data-theme-toggle
            aria-label="Switch theme"
            title="Theme"
            class="flex h-8 w-8 items-center justify-center rounded-full border border-sand-200 bg-sand-100 text-brand-600 transition-colors hover:bg-sand-200 hover:text-brand-900 focus:outline-none focus:ring-2 focus:ring-brand-600/25 dark:border-white/10 dark:bg-white/5 dark:text-sand-300 dark:hover:bg-white/10 dark:hover:text-white"
          >
            <svg data-theme-icon="to-dark" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <svg data-theme-icon="to-light" xmlns="http://www.w3.org/2000/svg" class="hidden h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </button>

          <a href="/settings" title="Account settings" aria-label="Account settings" class="flex h-8 w-8 items-center justify-center rounded-full bg-brand-100 text-brand-800 transition-colors hover:bg-brand-200 dark:bg-brand-900/60 dark:text-brand-200 dark:hover:bg-brand-800">
            <span class="material-symbols-outlined text-[17px]" aria-hidden="true">person</span>
          </a>
        </div>
      </div>
    </header>

    <main class="flex-1 space-y-5 px-4 py-6 sm:px-6">

      <!-- What SAGE remembers -->
      <section class="rounded-2xl border border-sand-200 bg-white p-5 sm:p-6 dark:border-white/5 dark:bg-[#1a2320]">
        <div class="mb-5 flex flex-wrap items-start justify-between gap-3">
          <div>
            <h2 class="font-heading text-lg font-bold text-brand-950 dark:text-white" data-i18n="memoryTitle">What SAGE remembers</h2>
            <p class="mt-1 text-sm text-brand-600 dark:text-sand-400" data-i18n="memoryHint">
              Everything saved about you. You can remove any item, or export a copy.
            </p>
          </div>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="export-button" class="btn-secondary" data-i18n="export">Export</button>
            <button type="button" id="delete-all-button" class="btn-danger" data-i18n="deleteAll">Forget everything</button>
          </div>
        </div>

        <div id="memory-error" dir="auto" role="alert" class="mb-4 hidden rounded-xl border border-red-200 bg-red-50 px-3.5 py-2.5 text-sm text-red-700 dark:border-red-900/70 dark:bg-red-950/40 dark:text-red-300"></div>
        <div id="memory-success" dir="auto" role="status" class="mb-4 hidden rounded-xl border border-brand-200 bg-brand-50 px-3.5 py-2.5 text-sm text-brand-800 dark:border-brand-800 dark:bg-brand-900/40 dark:text-brand-100"></div>

        <p id="memory-empty" class="hidden py-6 text-center text-sm text-brand-500 dark:text-sand-400" data-i18n="empty">
          Nothing saved yet.
        </p>

        <div id="memory-content" class="space-y-6">
          <div>
            <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-brand-500 dark:text-sand-400" data-i18n="entities">People &amp; things</h3>
            <ul id="entity-list" class="space-y-2"></ul>
          </div>

          <div>
            <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-brand-500 dark:text-sand-400" data-i18n="facts">Facts</h3>
            <ul id="fact-list" class="space-y-2"></ul>
          </div>

          <div>
            <h3 class="mb-2 text-xs font-semibold uppercase tracking-wide text-brand-500 dark:text-sand-400" data-i18n="relationships">Relationships</h3>
            <ul id="relationship-list" class="space-y-2"></ul>
          </div>
        </div>
      </section>

      <!-- Consent -->
      <section class="rounded-2xl border border-sand-200 bg-white p-5 sm:p-6 dark:border-white/5 dark:bg-[#1a2320]">
        <div class="mb-5">
          <h2 class="font-heading text-lg font-bold text-brand-950 dark:text-white" data-i18n="consentTitle">Permissions</h2>
          <p class="mt-1 text-sm text-brand-600 dark:text-sand-400" data-i18n="consentHint">
            Turn these off at any time. Nothing is shared without your permission.
          </p>
        </div>
        <ul id="consent-list" class="space-y-3"></ul>
      </section>

    </main>
  </div>

  <script src="{{ url_for('static', filename='session.js') }}"></script>
  <script src="{{ url_for('static', filename='memory-page.js') }}"></script>
</body>
</html>
