<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome · Token Harbor Chat</title>

  <!-- theme bootstrap: runs before first paint -->
  <script src="{{ url_for('static', filename='theme.js') }}"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              200: '#bfdbfe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          },
          boxShadow: {
            'subtle-elevated': '0 20px 40px -15px rgba(37, 99, 235, 0.07), 0 1px 3px 0 rgba(0, 0, 0, 0.05)',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="min-h-full flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-slate-50 via-blue-50/40 to-indigo-50/50 text-slate-800 antialiased selection:bg-brand-100 selection:text-brand-800 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 dark:text-slate-200 dark:selection:bg-brand-800 dark:selection:text-brand-100">

  <!-- theme toggle -->
  <button
    type="button"
    data-theme-toggle
    aria-label="Switch theme"
    title="Theme"
    class="fixed top-4 right-4 sm:top-6 sm:right-6 z-50 w-9 h-9 rounded-full flex items-center justify-center border transition-colors bg-white/80 border-slate-200 text-slate-600 hover:bg-white hover:text-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-600/40 dark:bg-slate-900/80 dark:border-slate-700 dark:text-slate-300 dark:hover:bg-slate-800 dark:hover:text-white"
  >
    <svg data-theme-icon="to-dark" xmlns="http://www.w3.org/2000/svg" class="hidden w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
    </svg>
    <svg data-theme-icon="to-light" xmlns="http://www.w3.org/2000/svg" class="hidden w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
    </svg>
  </button>

  <!-- ambient soft glow decorations -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10 flex items-center justify-center">
    <div class="w-[600px] h-[600px] bg-blue-400/10 dark:bg-blue-500/10 rounded-full blur-3xl transform -translate-y-12"></div>
    <div class="w-[500px] h-[500px] bg-indigo-300/10 dark:bg-indigo-500/10 rounded-full blur-3xl transform translate-x-32 translate-y-24"></div>
  </div>

  <main class="w-full max-w-[420px]">
    <div class="bg-white/95 dark:bg-slate-900/80 backdrop-blur-sm rounded-[16px] border border-slate-200/80 dark:border-slate-800 p-8 shadow-subtle-elevated dark:shadow-none animate-pop-in">

      <!-- Brand badge -->
      <div class="flex items-center justify-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-600/15 border border-brand-100 dark:border-brand-600/30 flex items-center justify-center text-brand-600 dark:text-brand-500 shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            <path d="M8 10h.01M12 10h.01M16 10h.01" stroke-width="2.5"></path>
          </svg>
        </div>
      </div>

      <!-- Header copy -->
      <div class="text-center mb-8">
        <h1 class="text-2xl sm:text-[26px] font-extrabold text-slate-900 dark:text-white tracking-tight font-heading mb-2">
          Welcome
        </h1>
        <p class="text-sm text-slate-500 dark:text-slate-400 leading-relaxed max-w-xs mx-auto">
          Enter your name to start chatting with your AI assistant.
        </p>
      </div>

      <!-- Name form -->
      <form id="name-form" class="space-y-4" autocomplete="off">
        <div>
          <label for="name-input" class="block text-xs font-semibold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5 ml-0.5">
            Your name
          </label>
          <div class="relative rounded-xl shadow-sm">
            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 dark:text-slate-500">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <input
              type="text"
              id="name-input"
              name="name"
              required
              maxlength="40"
              autocomplete="name"
              placeholder="Your name"
              autofocus
              class="w-full block pl-10 pr-4 py-2.5 bg-slate-50/50 hover:bg-slate-50 focus:bg-white text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 rounded-xl border border-slate-200 dark:border-slate-700 dark:bg-slate-800/50 dark:hover:bg-slate-800 dark:focus:bg-slate-800 focus:outline-none focus:ring-2 focus:ring-brand-600/20 focus:border-brand-600 transition-colors"
            >
          </div>
        </div>

        <button
          type="submit"
          class="w-full inline-flex items-center justify-center gap-2 px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:bg-brand-800 text-white font-medium text-sm transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-600 focus:ring-offset-2 dark:focus:ring-offset-slate-900"
        >
          <span>Start chatting</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <p class="text-xs text-center text-slate-400 dark:text-slate-500 pt-1">
          Your name is saved only in this browser.
        </p>
      </form>

      <!-- Returning visitor -->
      <div id="continue" class="hidden mt-6 pt-6 border-t border-slate-100 dark:border-slate-800 text-center space-y-3">
        <p class="text-sm text-slate-600 dark:text-slate-300">
          Welcome back, <strong id="saved-name" class="font-semibold text-slate-900 dark:text-white">User</strong>!
        </p>
        <div class="flex items-center justify-center gap-4 text-xs font-medium">
          <a href="/chat" id="continue-link" class="text-brand-600 dark:text-brand-500 hover:text-brand-700 dark:hover:text-brand-400 underline underline-offset-4 focus:outline-none focus:ring-2 focus:ring-brand-600 rounded">
            Continue as <span class="sr-only">saved user</span>
          </a>
          <span class="text-slate-300 dark:text-slate-600" aria-hidden="true">&bull;</span>
          <a href="#" id="reset-name" class="text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 underline underline-offset-4 focus:outline-none focus:ring-2 focus:ring-slate-400 rounded">
            Switch name
          </a>
        </div>
      </div>

    </div>

    <div class="text-center mt-6">
      <span class="text-xs text-slate-400 dark:text-slate-500 font-medium">Token Harbor Chat &bull; AI Assistant</span>
    </div>
  </main>

  <script src="{{ url_for('static', filename='welcome.js') }}"></script>
</body>
</html>
